plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'moe.xzr.fivegtile'
    compileSdk 37

    defaultConfig {
        applicationId "moe.xzr.fivegtile"
        minSdk 29
        targetSdk 37
        versionCode 3
        versionName "1.2"

        vectorDrawables {
            useSupportLibrary true
        }
        
        // 只保留 arm64-v8a 架构，减小 APK 体积
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            // 优先从环境变量读取（CI 环境），否则保留为空（本地环境回退到 debug）
            def storeFilePath = System.getenv("RELEASE_STORE_FILE")
            if (storeFilePath != null) {
                // 使用 rootProject.file 确保相对路径基于仓库根目录解析，
                // 兼容 CI 工作流解码到根目录的 keystore 以及绝对路径。
                storeFile rootProject.file(storeFilePath)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // 如果有配置 release 签名环境变量则使用，否则回退到 debug 以便本地无密钥时仍可构建
            signingConfig System.getenv("RELEASE_STORE_FILE") != null ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        aidl true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation "com.github.topjohnwu.libsu:core:${libsuVersion}"
    implementation "com.github.topjohnwu.libsu:service:${libsuVersion}"
    implementation "dev.rikka.shizuku:api:${shizukuVersion}"
    implementation "dev.rikka.shizuku:provider:${shizukuVersion}"
    debugImplementation 'androidx.compose.ui:ui-tooling'

}
