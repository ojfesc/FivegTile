name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 37 with fallback to 36
        shell: bash
        run: |
          set -euo pipefail

          # 优先尝试稳定渠道的 android-37。
          if sdkmanager "platforms;android-37" "build-tools;37.0.0" >/dev/null 2>&1; then
            echo "Installed android-37 from stable channel"
            exit 0
          fi

          # 稳定渠道没有时，尝试预览渠道。
          if sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0" >/dev/null 2>&1; then
            echo "Installed android-37 from preview channel"
            exit 0
          fi

          # 两者都不可用时回退到 android-36，
          # 并临时把 compileSdk/targetSdk 降到 36 以便仍能编译。
          # 该修改只发生在 CI 工作区，不会提交回仓库。
          echo "::warning::android-37 unavailable, falling back to android-36"
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sed -i 's/compileSdk 37/compileSdk 36/' app/build.gradle hiddenapi/build.gradle
          sed -i 's/targetSdk 37/targetSdk 36/' app/build.gradle hiddenapi/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect version info
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # 从 app/build.gradle 读取 versionName 和 versionCode，用于产物命名。
          VERSION_NAME=$(grep -oP "versionName\s+[\"']\K[^\"']+" app/build.gradle | head -n1)
          VERSION_CODE=$(grep -oP "versionCode\s+\K[0-9]+" app/build.gradle | head -n1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Rename APKs
        shell: bash
        run: |
          set -euo pipefail
          BASE="FivegTile-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}-${{ steps.version.outputs.short_sha }}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${BASE}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/${BASE}-release.apk"
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FivegTile-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.short_sha }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          # 使用固定 tag，每次推送覆盖，便于直接下载最新 APK。
          tag_name: latest
          name: Latest build
          body: |
            自动构建自 ${{ github.sha }}
            版本：${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})
          files: dist/*.apk
          make_latest: true
          prerelease: false
